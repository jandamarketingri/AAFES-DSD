<!DOCTYPE html>
<html>
<head>
    <title>Sales Portal - Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 800px;
            width: 90%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 18px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .nav-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        .nav-card h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        .nav-card p {
            margin: 0;
            opacity: 0.9;
            font-size: 14px;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Admin</h1>
    <p class="subtitle">Manage portal styles and settings</p>

    <div class="nav-grid">
        <a href="admin-add-style.html" class="nav-card">
            <div class="icon">➕</div>
            <h2>Add Style</h2>
            <p>Add a new style to apparel or signs</p>
        </a>

        <a href="admin-remove-style.html" class="nav-card">
            <div class="icon">➖</div>
            <h2>Remove Style</h2>
            <p>Remove an existing style</p>
        </a>
    </div>

    <a href="index.html" class="back-link">&larr; Back to Portal</a>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
$(document).ready(function(){
    var authData = sessionStorage.getItem('salesPortalAuth');
    if(!authData){
        window.location.href = 'login.html';
        return;
    }
    try {
        var auth = JSON.parse(authData);
        if (auth.role !== 'Admin') {
            window.location.href = 'index.html';
        }
    } catch(e){
        sessionStorage.removeItem('salesPortalAuth');
        window.location.href = 'login.html';
    }
});
</script>

</body>
</html>
